name: Release
on:
  push:
    tags: ["v*"]
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check release version
        run: |
          if ! jq -e --arg version "${GITHUB_REF_NAME#v}" '.version == $version' custom_components/vents_ahu/manifest.json > /dev/null; then
            printf 'Release tag %s does not match the manifest version.\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Package the integration
        run: git archive --format=zip --output="$RUNNER_TEMP/vents_ahu.zip" HEAD:custom_components/vents_ahu
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/vents_ahu.zip" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
