name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        harness: ["0.13.236", "0.13.316"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: python -m pip install ruff mypy pytest-homeassistant-custom-component==${{ matrix.harness }}
      # CI requires aiovents 0.1.0 on PyPI; it has not been published yet.
      - run: python -m pip install aiovents==0.1.0
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy --strict custom_components
      - run: pytest -q
