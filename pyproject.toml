[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-p no:respx"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
follow_imports = "silent"
files = ["custom_components"]

[[tool.mypy.overrides]]
module = ["probatio"]
ignore_missing_imports = true
